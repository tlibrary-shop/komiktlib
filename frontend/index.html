<head>

<title>TLIBRARY — Baca Komik Online</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
:root{--bg:#030b14;--panel:#071522;--panel2:#0a1b2c;--line:#193047;--text:#f4f7fb;--muted:#91a1b4;--gold:#f4b95e;--gold2:#ffd58a;--danger:#ef6b6b;--shadow:0 18px 60px #0008}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 70% 0,#10283b55,transparent 35%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
.header{height:72px;border-bottom:1px solid #ffffff12;background:#04101beF;backdrop-filter:blur(18px);position:sticky;top:0;z-index:50}.nav{max-width:1440px;height:100%;margin:auto;padding:0 28px;display:flex;align-items:center;gap:26px}.brand{display:flex;align-items:center;gap:11px;min-width:205px}.brand-mark{width:35px;height:35px;color:var(--gold)}.brand-name{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;letter-spacing:.4px}.brand-name b{color:var(--gold)}.links{display:flex;gap:8px;align-items:center}.nav-btn{border:0;background:transparent;color:#9eacbd;padding:11px 13px;border-radius:10px;font-size:13px}.nav-btn:hover,.nav-btn.active{color:#fff;background:#ffffff09}.nav-btn.active{color:var(--gold)}.search{margin-left:auto;width:min(270px,27vw);height:39px;border:1px solid #24394e;background:#091725;border-radius:22px;display:flex;align-items:center;padding:0 13px;gap:9px}.search input{width:100%;background:none;border:0;outline:0;color:#fff;font-size:12px}.search input::placeholder{color:#65788d}.actions{display:flex;gap:8px}.icon-btn{width:38px;height:38px;border:1px solid #1b3045;background:#081522;border-radius:50%;color:#b9c5d2}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#1d2b3d,#b36b3e);display:grid;place-items:center;border:1px solid #ffffff22;font-size:15px}
.container{max-width:1440px;margin:auto;padding:0 28px 80px}.hero{min-height:390px;margin:0 -28px;padding:52px 28px 35px;position:relative;overflow:hidden;display:flex;align-items:center}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#030b14 3%,#030b14df 25%,#030b1480 52%,#030b1460 100%),linear-gradient(0deg,#030b14 0%,transparent 30%)}.hero-bg{position:absolute;inset:0;background-position:center 25%;background-size:cover;filter:saturate(.85) contrast(1.05);opacity:.6;transform:scale(1.03)}.hero-content{position:relative;z-index:2;max-width:650px;padding:15px 28px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700}.hero h1{font-family:'Playfair Display',serif;font-size:clamp(38px,5vw,65px);line-height:.98;margin:12px 0 15px;letter-spacing:-1.5px}.hero h1 span{color:var(--gold2)}.hero p{max-width:550px;color:#b9c5d2;line-height:1.65;font-size:14px;margin:0 0 22px}.hero-meta{display:flex;gap:10px;align-items:center;color:#a8b6c6;font-size:12px;margin-bottom:22px}.btn{border:1px solid #ffffff25;background:#ffffff08;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600}.btn.gold{background:linear-gradient(135deg,#ffd489,#e9a744);color:#15100a;border:0;box-shadow:0 8px 28px #e9a74433}.btn:hover{transform:translateY(-1px)}.hero-buttons{display:flex;gap:10px}
.section{margin-top:30px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.section-title{display:flex;align-items:center;gap:10px;font-family:'Playfair Display',serif;font-size:21px}.section-title .spark{color:var(--gold)}.see{color:#9eacbd;font-size:12px}.see:hover{color:var(--gold)}
.genre-strip{display:grid;grid-template-columns:repeat(10,1fr);gap:10px}.genre-card{min-height:76px;border:1px solid #1a3044;background:linear-gradient(180deg,#0a1b2a,#071522);border-radius:11px;padding:12px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#aebccc;font-size:11px;text-align:center;transition:.2s}.genre-card .gicon{font-size:19px;color:var(--gold)}.genre-card:hover{border-color:#c28d42;background:#0c2031;transform:translateY(-2px);color:#fff}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}.card{min-width:0}.cover{position:relative;aspect-ratio:2/2.85;background:#0c1926;border-radius:8px;overflow:hidden;border:1px solid #ffffff0e}.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s}.card:hover .cover img{transform:scale(1.04)}.badge{position:absolute;top:8px;left:8px;padding:4px 7px;background:#e9eff5;color:#14202d;border-radius:5px;font-size:9px;font-weight:700}.rank{position:absolute;left:8px;bottom:8px;width:26px;height:26px;border-radius:7px;background:#091521eF;border:1px solid #ffffff20;display:grid;place-items:center;font-weight:700;color:#fff}.card-title{font-size:12px;font-weight:600;margin:9px 2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-meta{font-size:10px;color:#718397;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wide-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:15px}.wide-card{min-width:0}.wide-cover{aspect-ratio:1.8/1;border-radius:8px;overflow:hidden;border:1px solid #ffffff0d;background:#0c1926}.wide-cover img{width:100%;height:100%;object-fit:cover}.wide-title{font-size:11px;font-weight:600;margin:7px 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wide-meta{font-size:9px;color:#718397}
.loading{display:grid;place-items:center;min-height:220px;color:#8495a8}.spinner{width:28px;height:28px;border:2px solid #ffffff15;border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{padding:25px;border:1px solid #733b3b;background:#241116;border-radius:12px;color:#e9a0a0}
.page{padding-top:32px}.page h1{font-family:'Playfair Display',serif;font-size:35px;margin:0 0 8px}.sub{color:var(--muted);font-size:13px;margin-bottom:25px}.results-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:17px}
.detail{padding-top:28px}.back{color:#8fa0b3;font-size:12px;margin-bottom:20px;display:inline-flex;gap:7px}.detail-top{display:grid;grid-template-columns:245px 1fr;gap:32px;padding:25px;border:1px solid #183047;background:linear-gradient(135deg,#091827,#06111c);border-radius:16px;box-shadow:var(--shadow)}.detail-cover{aspect-ratio:2/2.85;border-radius:9px;overflow:hidden}.detail-cover img{width:100%;height:100%;object-fit:cover}.detail-info h1{font-family:'Playfair Display',serif;font-size:38px;margin:0 0 5px}.alt{color:#8091a5;font-size:12px;margin-bottom:14px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.chip{font-size:10px;padding:5px 8px;border:1px solid #284157;border-radius:20px;color:#aab7c5;background:#0b1c2b}.info-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 22px;margin:20px 0}.info-item{font-size:11px;color:#8193a6}.info-item b{color:#dbe2ea;font-weight:500;margin-left:5px}.synopsis{font-size:13px;line-height:1.75;color:#aab7c5;max-width:850px}.detail-actions{display:flex;gap:10px;margin-top:20px}.chapter-box{margin-top:25px;border:1px solid #183047;border-radius:14px;background:#071522;padding:20px}.chapter-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.chapter-head h2{font-family:'Playfair Display',serif;font-size:21px;margin:0}.chapter-controls{display:flex;gap:8px}.select{background:#0a1b2b;color:#c9d3de;border:1px solid #22394e;border-radius:8px;padding:8px 11px;font-size:11px}.chapters{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-height:470px;overflow:auto}.chapter{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;background:#091a29;border:1px solid #122a3e;border-radius:8px;font-size:11px;color:#c2ccd7}.chapter:hover{border-color:#b17c37;color:#fff}.chapter small{color:#718397;font-size:9px}
.reader{background:#000;min-height:100vh}.reader-bar{position:sticky;top:0;z-index:30;background:#050b11eF;backdrop-filter:blur(15px);border-bottom:1px solid #ffffff12;padding:12px 18px;display:flex;align-items:center;justify-content:space-between}.reader-title{font-size:12px;font-weight:600;max-width:55vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reader-actions{display:flex;gap:8px}.reader-pages{display:flex;flex-direction:column;align-items:center}.reader-pages img{display:block;width:min(100%,900px);height:auto;background:#111}.reader-nav{display:flex;justify-content:center;gap:10px;padding:24px}.reader-empty{padding:100px 20px;text-align:center;color:#8998a8}
.empty{text-align:center;padding:60px;color:#738397;border:1px dashed #1c3347;border-radius:12px}.footer{margin-top:55px;border-top:1px solid #ffffff0b;padding:25px 0;color:#66788c;font-size:10px;display:flex;justify-content:space-between}.mobile-nav{display:none}
@media(max-width:1100px){.grid{grid-template-columns:repeat(5,1fr)}.wide-grid{grid-template-columns:repeat(4,1fr)}.genre-strip{grid-template-columns:repeat(5,1fr)}.results-grid{grid-template-columns:repeat(5,1fr)}.links{display:none}.search{width:35vw}}
@media(max-width:760px){.header{height:62px}.nav{padding:0 15px;gap:10px}.brand{min-width:auto}.brand-name{font-size:18px}.brand-mark{width:30px}.search{width:auto;flex:1;max-width:none}.actions .icon-btn{display:none}.avatar{width:31px;height:31px}.container{padding:0 15px 82px}.hero{margin:0 -15px;padding:30px 15px 28px;min-height:440px;align-items:end}.hero-content{padding:10px 10px 5px}.hero:before{background:linear-gradient(0deg,#030b14 4%,#030b14d8 38%,#030b1460 75%),linear-gradient(90deg,#030b1480,#030b1450)}.hero h1{font-size:42px}.hero p{font-size:12px}.genre-strip{display:flex;overflow:auto;padding-bottom:4px}.genre-card{min-width:91px}.grid{grid-template-columns:repeat(3,1fr);gap:14px}.wide-grid{grid-template-columns:repeat(2,1fr);gap:14px}.results-grid{grid-template-columns:repeat(3,1fr);gap:14px}.detail-top{grid-template-columns:120px 1fr;gap:16px;padding:16px}.detail-info h1{font-size:25px}.info-list{grid-template-columns:1fr}.detail-cover{width:120px}.chapters{grid-template-columns:1fr}.chapter-head{align-items:flex-start;gap:10px;flex-direction:column}.footer{display:block;text-align:center}.footer span{display:block;margin:6px}.mobile-nav{display:flex;position:fixed;z-index:60;bottom:0;left:0;right:0;height:62px;background:#06111ced;backdrop-filter:blur(16px);border-top:1px solid #ffffff12;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}.mobile-nav button{background:none;border:0;color:#718397;font-size:9px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center}.mobile-nav button.active{color:var(--gold)}.mobile-nav i{font-style:normal;font-size:17px}.page{padding-top:24px}}
@media(max-width:430px){.brand-name{display:none}.hero h1{font-size:38px}.detail-top{grid-template-columns:105px 1fr}.detail-cover{width:105px}.detail-info h1{font-size:21px}.detail-info .alt{font-size:9px}.results-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = "";
const state={cache:{},route:"home"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const imgSrc=u=>u?"/image-proxy?url="+encodeURIComponent(u):"";
const fallbackImg="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="500" height="700"><rect width="100%" height="100%" fill="#0b1825"/><text x="50%" y="50%" fill="#63758a" font-family="Arial" font-size="24" text-anchor="middle">TLIBRARY</text></svg>');
function iconLogo(){return '<svg class="brand-mark" viewBox="0 0 64 64" fill="none"><path d="M10 10h18c7 0 12 3 14 7v37c-3-4-8-6-14-6H10z" stroke="currentColor" stroke-width="4"/><path d="M54 10H36c-7 0-12 3-14 7v37c3-4 8-6 14-6h18z" stroke="currentColor" stroke-width="4"/><path d="M32 10v38" stroke="currentColor" stroke-width="4"/><path d="M31 4v9M26.5 8.5h9" stroke="#f4b95e" stroke-width="3"/></svg>'}
function shell(content){return '<header class="header"><nav class="nav"><a class="brand" href="#home">'+iconLogo()+'<span class="brand-name">T<b>LIBRARY</b></span></a><div class="links"><a class="nav-btn" data-nav="home" href="#home">⌂ &nbsp;Beranda</a><a class="nav-btn" data-nav="latest" href="#latest">◌ &nbsp;Terbaru</a><a class="nav-btn" data-nav="popular" href="#popular">♡ &nbsp;Populer</a><a class="nav-btn" data-nav="genres" href="#genres">▦ &nbsp;Genre⌄</a></div><form class="search" id="searchForm"><span>⌕</span><input id="searchInput" placeholder="Cari judul, author, atau genre..."></form><div class="actions"><button class="icon-btn" onclick="document.documentElement.classList.toggle('dim')">☾</button><button class="icon-btn">♧</button><span class="avatar">◉</span></div></nav></header><main class="container">'+content+'</main><nav class="mobile-nav"><button data-nav="home" onclick="go('home')"><i>⌂</i>Beranda</button><button data-nav="latest" onclick="go('latest')"><i>◌</i>Terbaru</button><button data-nav="popular" onclick="go('popular')"><i>♡</i>Populer</button><button data-nav="genres" onclick="go('genres')"><i>▦</i>Genre</button><button data-nav="search" onclick="document.getElementById('searchInput').focus()"><i>⌕</i>Cari</button></nav>'}
async function api(path){if(state.cache[path])return state.cache[path];const r=await fetch(API+path,{headers:{Accept:"application/json"}});if(!r.ok)throw new Error((await r.text()).slice(0,180)||"Gagal mengambil data");const d=await r.json();state.cache[path]=d;return d}
function loading(){return '<div class="loading"><div class="spinner"></div></div>'}
function card(x,i=0){const slug=x.slug||x.mangaSlug||(x.apiDetailLink||"").split("/").pop();return '<article class="card" onclick="go(\'detail/'+encodeURIComponent(slug||"")+'\')"><div class="cover"><img loading="lazy" src="'+imgSrc(x.thumbnail)+'" onerror="this.onerror=null;this.src=fallbackImg"><span class="badge">'+esc(x.type||"Update")+'</span></div><div class="card-title">'+esc(x.title||"Tanpa judul")+'</div><div class="card-meta">'+esc(x.latestChapter||x.latestChapterTitle||x.updateTime||x.genre||"Komik")+'</div></article>'}
function wideCard(x){const slug=x.slug||x.mangaSlug||(x.apiDetailLink||"").split("/").pop();return '<article class="wide-card" onclick="go(\'detail/'+encodeURIComponent(slug||"")+'\')"><div class="wide-cover"><img loading="lazy" src="'+imgSrc(x.thumbnail)+'" onerror="this.onerror=null;this.src=fallbackImg"></div><div class="wide-title">'+esc(x.title||"Tanpa judul")+'</div><div class="wide-meta">'+esc(x.genre||x.type||"Komik")+'</div></article>'}
function section(title,items,kind="card"){return '<section class="section" id="'+title.toLowerCase().replace(/[^a-z]+/g,"-")+'"><div class="section-head"><h2 class="section-title"><span class="spark">✦</span>'+esc(title)+'</h2><a class="see" href="#'+(title==="Terbaru"?"latest":"popular")+'">Lihat Semua →</a></div><div class="'+(kind==="wide"?"wide-grid":"grid")+'">'+items.map((x,i)=>kind==="wide"?wideCard(x):card(x,i)).join("")+'</div></section>'}
function genreIcon(name){const n=(name||"").toLowerCase();return n.includes("action")?"⚔":n.includes("adventure")?"⌁":n.includes("comedy")?"☻":n.includes("drama")?"♟":n.includes("fantasy")?"✦":n.includes("romance")?"♡":n.includes("horror")?"☠":n.includes("mystery")?"⌾":n.includes("sci")?"⚯":"◈"}
async function home(){document.title="TLIBRARY — Baca Komik Online";$("#app").innerHTML=shell(loading());try{
  const results=await Promise.allSettled([api("/terbaru"),api("/komik-populer"),api("/genre-all"),api("/rekomendasi")]);
  const latest=results[0].status==="fulfilled"?results[0].value:[];
  const popular=results[1].status==="fulfilled"?results[1].value:{};
  const genres=results[2].status==="fulfilled"?results[2].value:[];
  const recs=results[3].status==="fulfilled"?results[3].value:[];
  const latestItems=Array.isArray(latest)?latest:[];
  const allPop=[...(popular?.manga?.items||[]),...(popular?.manhwa?.items||[]),...(popular?.manhua?.items||[])];
  const hero=allPop[0]||latestItems[0]||recs?.[0]||{};
  const genreItems=Array.isArray(genres)?genres.slice(0,10):[];
  const apiErrors=results.map((r,i)=>r.status==="rejected"?["Terbaru","Populer","Genre","Rekomendasi"][i]+": "+(r.reason?.message||"gagal"):"").filter(Boolean);
  const heroSlug=hero.mangaSlug||hero.slug||(hero.apiDetailLink||"").split("/").pop();
  const content=`<section class="hero"><div class="hero-bg" style="background-image:url('${imgSrc(hero.thumbnail||"")}')"></div><div class="hero-content"><div class="eyebrow">BACA KOMIK FAVORITMU</div><h1>Jelajahi Dunia<br><span>Tanpa Batas</span></h1><p>Ribuan komik berkualitas dari berbagai genre siap menemani harimu. Baca kapan saja, di mana saja, hanya di TLIBRARY.</p><div class="hero-meta">✦ ${esc(hero.type||"Manga / Manhwa / Manhua")} &nbsp; • &nbsp; ${esc(hero.genre||"Beragam genre")}</div><div class="hero-buttons"><button class="btn gold" onclick="go('detail/${encodeURIComponent(heroSlug||"")}')">▶ &nbsp;Mulai Membaca</button><button class="btn" onclick="go('genres')">Jelajahi Genre</button></div></div></section><section class="section"><div class="genre-strip">${genreItems.map(g=>'<a class="genre-card" href="#genre/'+encodeURIComponent(g.slug)+'"><span class="gicon">'+genreIcon(g.title)+'</span><span>'+esc(g.title)+'</span></a>').join("")}</div></section>${section("Terbaru",latestItems.slice(0,12))}${section("Paling Populer",allPop.slice(0,12),"wide")}${apiErrors.length?'<div class="error" style="margin-top:25px"><b>Sebagian sumber data gagal dimuat:</b><br>'+apiErrors.map(esc).join("<br>")+'</div>':""}<footer class="footer"><span>${iconLogo()} TLIBRARY</span><span>Baca. Jelajahi. Temukan Cerita Favoritmu.</span><span>© ${new Date().getFullYear()} TLIBRARY. All rights reserved.</span></footer>`;
  $("#app").innerHTML=shell(content);activate("home");
}catch(e){$("#app").innerHTML=shell('<div class="error"><b>TLIBRARY gagal memuat.</b><br>'+esc(e.message)+'<br><br>Silakan refresh halaman.</div>')}}
async function listPage(title,endpoint){$("#app").innerHTML=shell('<div class="page">'+loading()+'</div>');try{let d=await api(endpoint);let items=Array.isArray(d)?d:(d.items||d.results||d.data||[]);if(d&&!items.length&&(d.manga||d.manhwa||d.manhua))items=[...(d.manga?.items||[]),...(d.manhwa?.items||[]),...(d.manhua?.items||[])];$("#app").innerHTML=shell('<div class="page"><h1>'+esc(title)+'</h1><div class="sub">Data diambil langsung dari API TLIBRARY.</div><div class="results-grid">'+items.map(card).join("")+'</div></div>');activate(title.toLowerCase().includes("terbaru")?"latest":"popular")}catch(e){$("#app").innerHTML=shell('<div class="page"><div class="error">'+esc(e.message)+'</div></div>')}}
async function genres(){$("#app").innerHTML=shell('<div class="page">'+loading()+'</div>');try{const gs=await api("/genre-all");$("#app").innerHTML=shell('<div class="page"><h1>Genre</h1><div class="sub">Temukan komik berdasarkan genre yang tersedia dari sumber data.</div><div class="genre-strip">'+(gs||[]).map(g=>'<a class="genre-card" href="#genre/'+encodeURIComponent(g.slug)+'"><span class="gicon">'+genreIcon(g.title)+'</span><span>'+esc(g.title)+'</span></a>').join("")+'</div></div>');activate("genres")}catch(e){$("#app").innerHTML=shell('<div class="page"><div class="error">'+esc(e.message)+'</div></div>')}}
async function genre(slug){$("#app").innerHTML=shell('<div class="page">'+loading()+'</div>');try{const d=await api("/genre/"+encodeURIComponent(slug));const items=d.data||[];$("#app").innerHTML=shell('<div class="page"><a class="back" href="#genres">← Kembali ke genre</a><h1>'+esc(d.genre||slug)+'</h1><div class="sub">'+esc(d.totalManga||items.length)+' komik ditemukan · Halaman '+esc(d.currentPage||1)+'</div><div class="results-grid">'+items.map(card).join("")+'</div>'+(d.hasNextPage?'<div style="text-align:center;margin:28px"><button class="btn" onclick="genrePage('+JSON.stringify(slug)+','+((d.currentPage||1)+1)+')">Muat halaman berikutnya</button></div>':"")+'</div>');activate("genres")}catch(e){$("#app").innerHTML=shell('<div class="page"><div class="error">'+esc(e.message)+'</div></div>')}}
async function genrePage(slug,p){const key="/genre/"+slug+"/page/"+p;try{const d=await api(key);const old=document.querySelector(".results-grid");(d.data||[]).forEach(x=>old.insertAdjacentHTML("beforeend",card(x)));}catch(e){alert(e.message)}}
async function search(q){$("#app").innerHTML=shell('<div class="page">'+loading()+'</div>');try{const d=await api("/search?q="+encodeURIComponent(q));const items=d.data||[];$("#app").innerHTML=shell('<div class="page"><a class="back" href="#home">← Beranda</a><h1>Hasil Pencarian</h1><div class="sub">'+esc(d.total||items.length)+' hasil untuk “'+esc(q)+'”</div>'+(items.length?'<div class="results-grid">'+items.map(card).join("")+'</div>':'<div class="empty">Tidak ada komik yang ditemukan.</div>')+'</div>')}catch(e){$("#app").innerHTML=shell('<div class="page"><div class="error">'+esc(e.message)+'</div></div>')}}
async function detail(slug){$("#app").innerHTML=shell('<div class="detail">'+loading()+'</div>');try{const d=await api("/detail-komik/"+encodeURIComponent(slug));const info=Object.entries(d.info||{}).map(([k,v])=>'<div class="info-item">'+esc(k)+': <b>'+esc(v)+'</b></div>').join("");const chapters=[...(d.chapters||[])].reverse();const first=chapters[chapters.length-1];const latest=chapters[0];$("#app").innerHTML=shell('<div class="detail"><a class="back" href="#home">← Kembali</a><div class="detail-top"><div class="detail-cover"><img src="'+imgSrc(d.thumbnail)+'" onerror="this.onerror=null;this.src=fallbackImg"></div><div class="detail-info"><h1>'+esc(d.title)+'</h1><div class="alt">'+esc(d.alternativeTitle||"")+'</div><div class="chips">'+(d.genres||[]).map(g=>'<span class="chip">'+esc(g)+'</span>').join("")+'</div><div class="info-list">'+info+'</div><p class="synopsis">'+esc(d.sinopsis||d.description||"Sinopsis belum tersedia.")+'</p><div class="detail-actions">'+(latest?.chapterNumber?'<button class="btn gold" onclick="go(\'read/'+encodeURIComponent(slug)+'/'+encodeURIComponent(latest.chapterNumber)+'\')">▶ Baca Terbaru</button>':"")+(first?.chapterNumber?'<button class="btn" onclick="go(\'read/'+encodeURIComponent(slug)+'/'+encodeURIComponent(first.chapterNumber)+'\')">Mulai dari Awal</button>':"")+'</div></div></div><div class="chapter-box"><div class="chapter-head"><h2>Daftar Chapter <span style="color:#6f8195;font-size:12px">('+chapters.length+')</span></h2><select class="select" onchange="filterChapters(this.value)"><option value="all">Semua Chapter</option><option value="recent">Terbaru</option><option value="old">Terlama</option></select></div><div class="chapters" id="chapters">'+chapters.map(c=>'<a class="chapter" data-num="'+esc(c.chapterNumber||"")+'" href="#read/'+encodeURIComponent(slug)+'/'+encodeURIComponent(c.chapterNumber||"")+'"><span>'+esc(c.title||("Chapter "+c.chapterNumber))+'</span><small>'+esc(c.date||c.views||"")+'</small></a>').join("")+'</div></div>'+(d.similarKomik?.length?section("Komik Serupa",d.similarKomik.slice(0,6)):"")+'</div>')}catch(e){$("#app").innerHTML=shell('<div class="detail"><div class="error">'+esc(e.message)+'</div></div>')}}
function filterChapters(v){const xs=[...document.querySelectorAll("#chapters .chapter")];if(v==="recent")xs.forEach((x,i)=>x.style.display=i<30?"flex":"none");else if(v==="old")xs.forEach((x,i)=>x.style.display=i>=Math.max(0,xs.length-30)?"flex":"none");else xs.forEach(x=>x.style.display="flex")}
async function reader(slug,ch){document.body.className="reader";$("#app").innerHTML='<div class="reader"><div class="reader-bar"><button class="btn" onclick="go(\'detail/'+encodeURIComponent(slug)+'\')">← Detail</button><div class="reader-title">Memuat chapter…</div><div class="reader-actions"></div></div><div class="reader-pages">'+loading()+'</div></div>';try{const d=await api("/baca-chapter/"+encodeURIComponent(slug)+"/"+encodeURIComponent(ch));const prev=d.navigation?.prevChapter?.chapter,next=d.navigation?.nextChapter?.chapter;document.querySelector(".reader-title").textContent=d.title||("Chapter "+ch);const pages=(d.images||[]).map((im,i)=>'<img loading="'+(i<2?"eager":"lazy")+'" src="'+imgSrc(im.src)+'" onerror="this.onerror=null;this.src=\''+imgSrc(im.fallbackSrc||im.src)+'\'" alt="'+esc(im.alt||"")+'">').join("");document.querySelector(".reader-pages").innerHTML=pages||'<div class="reader-empty">Gambar chapter tidak tersedia.</div>';document.querySelector(".reader-actions").innerHTML=(prev?'<button class="btn" onclick="go(\'read/'+encodeURIComponent(slug)+'/'+encodeURIComponent(prev)+'\')">‹ Prev</button>':"")+(next?'<button class="btn gold" onclick="go(\'read/'+encodeURIComponent(slug)+'/'+encodeURIComponent(next)+'\')">Next ›</button>':"")}catch(e){document.querySelector(".reader-pages").innerHTML='<div class="reader-empty">'+esc(e.message)+'</div>'}}
function activate(name){document.querySelectorAll("[data-nav]").forEach(x=>x.classList.toggle("active",x.dataset.nav===name));document.body.className=""}
function go(route){location.hash="#"+route}
function route(){const raw=location.hash.slice(1)||"home";const parts=raw.split("/");const r=parts[0];state.route=r;window.scrollTo(0,0);if(r==="home")home();else if(r==="latest")listPage("Terbaru","/terbaru");else if(r==="popular")listPage("Paling Populer","/komik-populer");else if(r==="genres")genres();else if(r==="genre")genre(decodeURIComponent(parts[1]||""));else if(r==="detail")detail(decodeURIComponent(parts[1]||""));else if(r==="read")reader(decodeURIComponent(parts[1]||""),decodeURIComponent(parts[2]||""));else if(r==="search")search(decodeURIComponent(parts.slice(1).join("/")||""));else home()}
window.addEventListener("hashchange",route);
document.addEventListener("submit",e=>{if(e.target.id==="searchForm"){e.preventDefault();const q=$("#searchInput").value.trim();if(q)go("search/"+encodeURIComponent(q))}});
document.addEventListener("DOMContentLoaded",route);
</script>
</body>
</html>
